# Postgres 16 with the pgvector extension.
# Port 5433 on the host so it doesn't clash with a local Postgres on 5432.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: regs-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: regs
    ports:
      - "5433:5432"
    volumes:
      - regs-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  regs-data:
